[project]
name = "fastlimit"
version = "0.1.0"
description = "Production-grade rate limiting for FastAPI — dual IP/user buckets, pluggable backends, clean API."
readme = "README.md"
authors = [
    { name = "Muizzyranking", email = "oyebowaleabdulmuiz@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["fastapi", "rate-limit", "redis", "middleware", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.14.0",
    "fastapi>=0.137.1",
    "redis>=8.0.0",
]

[project.optional-dependencies]
redis = [
    "redis>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "fakeredis>=2.36.1",
    "httpx>=0.28.1",
    "lupa>=2.8",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "twine>=6.2.0",
    "uvicorn>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/muizzyranking/fastlimit"
Documentation = "https://fastlimit.muizzyranking.me"
Repository = "https://github.com/muizzyranking/fastlimit"
Issues = "https://github.com/muizzyranking/fastlimit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fastlimit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/fastlimit"]
